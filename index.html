<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수학 오답노트</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;font-size:18px;color:#222;background:#f7f8fb}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #e3e6ee;padding:10px 12px;z-index:5}
h1{font-size:20px;margin:0 0 8px}
nav{display:flex;gap:6px;flex-wrap:wrap}
main{max-width:560px;margin:0 auto;padding:16px}
h2{font-size:22px;margin:8px 0 12px}
.note{font-size:15px;color:#5a6273;line-height:1.5}
button{font:inherit;cursor:pointer}
.tab{min-height:44px;padding:0 12px;border:1px solid #c8cfdd;border-radius:10px;background:#fff}
.tab.on{background:#3b6fd8;color:#fff;border-color:#3b6fd8}
.big{display:block;width:100%;min-height:56px;margin:12px 0;border:none;border-radius:14px;background:#3b6fd8;color:#fff;font-size:20px}
.big:disabled{background:#b9c3d6;cursor:default}
.sm{min-height:44px;padding:0 12px;border:1px solid #c8cfdd;border-radius:10px;background:#fff}
.sm.pri{background:#3b6fd8;color:#fff;border-color:#3b6fd8}
.sm:disabled{opacity:.5}
.card{background:#fff;border:1px solid #e3e6ee;border-radius:14px;padding:14px;margin:10px 0}
.card.done{opacity:.6}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:6px 0}
.tag{background:#eaf0fc;color:#2a4fa0;border-radius:8px;padding:4px 8px;font-size:15px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px}
input,select{min-height:44px;font-size:16px;padding:8px 10px;border:1px solid #c8cfdd;border-radius:10px;background:#fff}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;margin:0}
input[type=password],input[type=number]{width:100%}
input[type=file]{width:100%;min-height:56px;padding:12px;font-size:16px}
label{display:block;margin:10px 0}
.choice{display:block;width:100%;text-align:left;min-height:48px;margin:6px 0;padding:10px 12px;border:2px solid #c8cfdd;border-radius:12px;background:#fff;font-size:18px}
.choice.sel{border-color:#3b6fd8;background:#eef3ff}
.choice.right{border-color:#2e8b57;background:#e8f7ee}
.choice.wrong{border-color:#d9534f;background:#fdecea}
.q{background:#fff;border-radius:14px;padding:14px;margin:12px 0;border:1px solid #e3e6ee}
.qtext{white-space:pre-wrap;line-height:1.6}
.explain{white-space:pre-wrap;background:#f4f6fb;border-radius:10px;padding:10px;line-height:1.6;margin-top:8px}
.verdict{font-weight:bold;margin:8px 0}
.bar{height:16px;background:#e3e6ee;border-radius:8px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:linear-gradient(90deg,#3b6fd8,#7aa7f0);transition:width .4s}
.level{font-size:22px;font-weight:bold}
.stickers{display:flex;flex-wrap:wrap;gap:10px;font-size:28px}
.stickers span{display:inline-flex;align-items:center;gap:2px}
.stickers small{font-size:14px;color:#5a6273}
.logline{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #eef0f5}
.logline:last-child{border-bottom:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 16px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>수학 오답노트</h1>
  <nav>
    <button class="tab" data-go="notes">오답</button>
    <button class="tab" data-go="upload">등록</button>
    <button class="tab" data-go="random">랜덤</button>
    <button class="tab" data-go="records">기록</button>
    <button class="tab" data-go="settings">설정</button>
  </nav>
</header>
<main id="app"></main>
<div id="toast" role="status"></div>

<script>
const KEY_KEYS = 'mel_apikeys';
const KEY_DATA = 'mel_data';
// 모델 이름과 규칙은 여기서만 바꾸면 됩니다. (모델 이름은 확인 필요)
const CFG = { GEMINI_MODEL: 'gemini-2.5-flash', CLAUDE_MODEL: 'claude-sonnet-5-5' };

// 경험치 규칙
const XP = { correct: 10, wrong: 3, graduate: 30, randomSet: 20 };
const MAX_LEVEL = 50;
// 보석 10종, 5레벨마다 다음 보석
const GEMS = [
  { name: '수정', icon: '⚪' }, { name: '자수정', icon: '🟣' }, { name: '사파이어', icon: '🔵' },
  { name: '에메랄드', icon: '🟢' }, { name: '루비', icon: '🔴' }, { name: '토파즈', icon: '🟠' },
  { name: '아쿠아마린', icon: '🩵' }, { name: '다이아몬드', icon: '💎' }, { name: '오팔', icon: '🌸' },
  { name: '무지개 보석', icon: '🌈' },
];
// 레벨 L에 도달하는 데 필요한 누적 경험치
const xpFor = (L) => 40 * (L - 1) + 5 * (L - 1) * L;

const STICKERS = ['⭐', '🌟', '🎈', '🦄', '🐯', '🚀', '🌈', '🍀', '🎨', '🦖', '🧩', '🏅'];
const PRAISE = ['정답! 잘했어요 👏', '좋아요, 이 문제는 이제 내 것이에요!', '완벽해요! 생각을 잘 정리했네요.', '이번에는 정확하게 맞혔어요!'];
const COMFORT = ['괜찮아요. 틀린 문제가 제일 많이 배우는 문제예요.', '아쉬워요. 해설을 보면서 한 걸음 더 가 봐요.', '실수는 연습의 일부예요. 다시 풀면 돼요!'];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, f) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : f; } catch (e) { return f; } },
  set(k, v) { localStorage.setItem(k, JSON.stringify(v)); },
};
const load = () => {
  const d = store.get(KEY_DATA, null) || {};
  return { problems: d.problems || [], types: d.types || [], sets: d.sets || [], stickers: d.stickers || [], xp: Number(d.xp) || 0 };
};
const saveData = (d) => store.set(KEY_DATA, d);
const getKeys = () => store.get(KEY_KEYS, { gemini: '', claude: '' });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => new Date().toISOString().slice(0, 10);
const addType = (d, t) => { if (t && !d.types.includes(t)) d.types.push(t); };
const pick1 = (arr) => arr[Math.floor(Math.random() * arr.length)];

function levelInfo(xp) {
  let lv = 1;
  while (lv < MAX_LEVEL && xp >= xpFor(lv + 1)) lv++;
  return {
    xp, lv,
    gem: GEMS[Math.ceil(lv / 5) - 1],
    base: xpFor(lv),
    next: lv < MAX_LEVEL ? xpFor(lv + 1) : null,
  };
}

let state = {
  view: 'notes', filter: '전체', randomTypes: null, randomCount: 10, session: null,
  pendingFiles: [], uploadLog: [], uploading: false,
  keyTest: { gemini: '', claude: '' },
};
let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// ---------- AI 호출 ----------
const CLASSIFY_PROMPT = (types) => `수학 문제 사진을 읽고 아래 JSON 형식으로만 답하세요. 다른 말은 쓰지 마세요.
{"question":"문제 본문 (수식은 일반 문자로: x², ÷, √)","choices":["①…","②…","③…","④…","⑤…"],"answer_index":0,"type":"문제 유형 이름 (짧은 한국어)","summary":"핵심 정답을 한 줄로","explanation":"풀이 과정을 단계별로 짧게. 교과 용어 사용","hints":["힌트1: 방향만","힌트2: 식 세우기","힌트3: 계산 직전"]}
규칙: answer_index는 정답 보기의 번호(0~4). 사진에 보기가 없으면 5지선다 보기를 새로 만들고 정답 1개를 포함하세요. 기존 유형이 맞으면 같은 이름을 쓰세요. 기존 유형: ${types.join(', ') || '없음'}`;

const SIMILAR_PROMPT = (p) => `아래 문제와 같은 유형, 같은 개념의 유사문제를 1개 만드세요. 숫자와 조건만 바꾸고 난이도는 비슷하게 하세요. JSON 형식으로만 답하세요.
{"question":"","choices":["①…","②…","③…","④…","⑤…"],"answer_index":0,"explanation":"풀이를 단계별로 짧게","hints":["힌트1","힌트2","힌트3"]}
원본 문제: ${p.question}
원본 보기: ${p.choices.join(' ')}`;

function parseJson(t) {
  try {
    const s = t.indexOf('{'), e = t.lastIndexOf('}');
    return JSON.parse(t.slice(s, e + 1));
  } catch (e) {
    throw new Error('AI 응답을 읽지 못했어요. 다시 시도해 주세요.');
  }
}

// API 오류 응답에서 원인 메시지를 꺼내서 보여 줌
async function apiError(r, name) {
  let detail = '';
  try { const j = await r.json(); detail = (j.error && j.error.message) || ''; } catch (e) {}
  return new Error(`${name} 오류 (${r.status})${detail ? ' - ' + detail : ''}`);
}

async function callGemini(prompt, b64) {
  const key = getKeys().gemini;
  if (!key) throw new Error('설정에서 Gemini 키를 입력하고 저장하세요.');
  const parts = [{ text: prompt }];
  if (b64) parts.unshift({ inline_data: { mime_type: 'image/jpeg', data: b64 } });
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${CFG.GEMINI_MODEL}:generateContent?key=${encodeURIComponent(key)}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contents: [{ parts }], generationConfig: { responseMimeType: 'application/json' } }),
  });
  if (!r.ok) throw await apiError(r, 'Gemini');
  const j = await r.json();
  const txt = j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts[0].text;
  if (!txt) throw new Error('Gemini 응답이 비어 있어요. 사진을 다시 찍어 보세요.');
  return parseJson(txt);
}

async function callClaude(prompt) {
  const key = getKeys().claude;
  if (!key) throw new Error('설정에서 Claude 키를 입력하고 저장하세요.');
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({ model: CFG.CLAUDE_MODEL, max_tokens: 1500, messages: [{ role: 'user', content: prompt }] }),
  });
  if (!r.ok) throw await apiError(r, 'Claude');
  const j = await r.json();
  return parseJson(j.content[0].text);
}

// 사진을 적당한 크기의 JPEG로 줄여서 base64로 반환
async function fileToJpegBase64(file) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error('이미지를 열 수 없어요. 사진 형식(HEIC 등)을 확인해 주세요.'));
    i.src = url;
  });
  const s = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(url);
  return c.toDataURL('image/jpeg', 0.9).split(',')[1];
}

// 문제 텍스트 유사도 (글자 2개씩 묶어서 비교). 0.8 이상이면 같은 문제로 봄
function similarity(a, b) {
  const n = (s) => String(s).replace(/\s/g, '');
  a = n(a); b = n(b);
  if (!a || !b) return 0;
  const grams = (s) => { const g = new Set(); for (let i = 0; i < s.length - 1; i++) g.add(s.slice(i, i + 2)); return g; };
  const A = grams(a), B = grams(b);
  let inter = 0; A.forEach((x) => { if (B.has(x)) inter++; });
  return inter / ((A.size + B.size - inter) || 1);
}

// ---------- 등록 ----------
// 한 장 처리. 성공/실패 결과를 객체로 돌려줌
async function handleUpload(file) {
  try {
    const b64 = await fileToJpegBase64(file);
    const d = load();
    const res = await callGemini(CLASSIFY_PROMPT(d.types), b64);
    if (!res.question) throw new Error('문제 내용을 읽지 못했어요. 사진을 더 선명하게 다시 찍어 주세요.');
    const dup = d.problems.find((p) => similarity(p.question, res.question) >= 0.8);
    if (dup) {
      dup.wrongCount++; dup.correctStreak = 0; dup.graduated = false;
      saveData(d);
      return { ok: true, msg: `이미 있던 문제예요 → [${dup.type}] 틀린 횟수 ${dup.wrongCount}번으로 기록` };
    }
    addType(d, res.type);
    d.problems.push({
      id: uid(), type: res.type, question: res.question, choices: res.choices || [],
      answer_index: res.answer_index, summary: res.summary || '', explanation: res.explanation || '',
      hints: res.hints || [], wrongCount: 1, correctStreak: 0, graduated: false, createdAt: Date.now(),
    });
    saveData(d);
    return { ok: true, msg: `[${res.type}] 유형으로 저장 완료` };
  } catch (e) {
    return { ok: false, msg: e.message || '알 수 없는 오류가 났어요.' };
  }
}

// "등록" 버튼: 선택한 사진을 한 장씩 처리하면서 결과를 화면에 보여 줌
async function startUpload() {
  if (!state.pendingFiles.length || state.uploading) return;
  state.uploading = true;
  const files = state.pendingFiles;
  state.uploadLog = files.map((f) => ({ name: f.name, state: 'wait', msg: '대기 중' }));
  render();
  for (let i = 0; i < files.length; i++) {
    state.uploadLog[i].state = 'busy';
    state.uploadLog[i].msg = '읽는 중...';
    render();
    const r = await handleUpload(files[i]);
    state.uploadLog[i].state = r.ok ? 'ok' : 'err';
    state.uploadLog[i].msg = r.msg;
    render();
  }
  state.uploading = false;
  state.pendingFiles = [];
  render();
  const okCount = state.uploadLog.filter((x) => x.state === 'ok').length;
  toast(`${files.length}장 중 ${okCount}장 처리 완료`);
}

function retypeProblem(id, val) {
  const d = load();
  const p = d.problems.find((x) => x.id === id);
  if (!p) return;
  let t = val;
  if (val === '__new__') {
    t = (prompt('새 유형 이름을 입력하세요') || '').trim();
    if (!t) { render(); return; }
  }
  p.type = t; addType(d, t); saveData(d); render();
}

function deleteProblem(id) {
  if (!confirm('이 오답을 삭제할까요?')) return;
  const d = load();
  d.problems = d.problems.filter((p) => p.id !== id);
  saveData(d); render();
}

// ---------- 풀이 ----------
function startRetake(id) {
  const p = load().problems.find((x) => x.id === id);
  if (!p) return;
  state.session = { mode: 'retake', items: [p], answers: {}, hints: {}, open: {}, graded: false };
  go('session');
}

function startRandom() {
  const d = load();
  const sel = state.randomTypes ?? d.types;
  const pool = d.problems.filter((p) => !p.graduated && sel.includes(p.type));
  if (!pool.length) { toast('선택한 유형에 출제할 오답이 없어요.'); return; }
  const count = Math.min(state.randomCount, pool.length);
