<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수학 오답노트</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>수학 오답노트</h1>
    <button id="btn-settings" class="ghost">설정</button>
  </header>

  <main>
    <section id="screen-child" class="screen active">
      <h2>누가 공부하나요?</h2>
      <div id="child-list" class="child-list"></div>
    </section>

    <section id="screen-home" class="screen">
      <button id="btn-back" class="ghost">← 아이 선택</button>
      <h2 id="home-title"></h2>
      <p id="home-count" class="note"></p>
      <button class="big" disabled>오답 등록 (2단계에서 추가)</button>
    </section>

    <section id="screen-settings" class="screen">
      <button id="btn-settings-back" class="ghost">← 돌아가기</button>
      <h2>API 키 설정</h2>
      <p class="note">키는 이 기기 브라우저에만 저장되며 외부 서버로 보내지 않습니다.</p>
      <label>Gemini 키
        <input id="key-gemini" type="password" autocomplete="off">
      </label>
      <label>Claude 키
        <input id="key-claude" type="password" autocomplete="off">
      </label>
      <button id="btn-save-keys" class="big">저장</button>
      <p id="save-msg" class="note"></p>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
