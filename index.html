<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수학 오답노트</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;font-size:18px;color:#222;background:#f7f8fb}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #e3e6ee;padding:10px 12px;z-index:5}
h1{font-size:20px;margin:0 0 8px}
nav{display:flex;gap:6px;flex-wrap:wrap}
main{max-width:560px;margin:0 auto;padding:16px}
h2{font-size:21px;margin:18px 0 10px}
.note{font-size:15px;color:#5a6273;line-height:1.5}
button{font:inherit;cursor:pointer}
.tab{min-height:44px;padding:0 12px;border:1px solid #c8cfdd;border-radius:10px;background:#fff}
.tab.on{background:#3b6fd8;color:#fff;border-color:#3b6fd8}
.big{display:block;width:100%;min-height:56px;margin:12px 0;border:none;border-radius:14px;background:#3b6fd8;color:#fff;font-size:20px}
.big:disabled{background:#b9c3d6;cursor:default}
.sm{min-height:44px;padding:0 12px;border:1px solid #c8cfdd;border-radius:10px;background:#fff}
.sm.pri{background:#3b6fd8;color:#fff;border-color:#3b6fd8}
.sm:disabled{opacity:.5}
.card{background:#fff;border:1px solid #e3e6ee;border-radius:14px;padding:14px;margin:10px 0}
.card.done{opacity:.6}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:6px 0}
.chk{display:flex;align-items:center;gap:10px;min-height:44px}
input,select{min-height:44px;font-size:16px;padding:8px 10px;border:1px solid #c8cfdd;border-radius:10px;background:#fff}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;margin:0}
input[type=password],input[type=number]{width:100%}
input[type=file]{width:100%;min-height:56px;padding:12px;font-size:16px}
label{display:block;margin:10px 0}
.choice{display:block;width:100%;text-align:left;min-height:48px;margin:6px 0;padding:10px 12px;border:2px solid #c8cfdd;border-radius:12px;background:#fff;font-size:18px}
.choice.sel{border-color:#3b6fd8;background:#eef3ff}
.choice.right{border-color:#2e8b57;background:#e8f7ee}
.choice.wrong{border-color:#d9534f;background:#fdecea}
.q{background:#fff;border-radius:14px;padding:14px;margin:12px 0;border:1px solid #e3e6ee}
.qtext{white-space:pre-wrap;line-height:1.6}
.explain{white-space:pre-wrap;background:#f4f6fb;border-radius:10px;padding:10px;line-height:1.6;margin-top:8px}
.verdict{font-weight:bold;margin:8px 0}
.bar{height:16px;background:#e3e6ee;border-radius:8px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:linear-gradient(90deg,#3b6fd8,#7aa7f0);transition:width .4s}
.level{font-size:22px;font-weight:bold}
details{background:#fff;border:1px solid #e3e6ee;border-radius:14px;margin:10px 0;padding:4px 14px 10px}
summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:bold;font-size:19px}
.minor{margin:12px 0 2px;color:#2a4fa0;font-weight:bold}
.kpi{display:flex;gap:10px;text-align:center}
.kpi>div{flex:1;background:#f4f6fb;border-radius:12px;padding:10px}
.kpi strong{font-size:22px;display:block}
.acc{margin:10px 0}
.stickers{display:flex;flex-wrap:wrap;gap:10px;font-size:28px}
.stickers span{display:inline-flex;align-items:center;gap:2px}
.stickers small{font-size:14px;color:#5a6273}
.logline{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #eef0f5}
.logline:last-child{border-bottom:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 16px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center;z-index:10}
#toast.show{opacity:1}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<header>
  <h1>수학 오답노트</h1>
  <nav>
    <button class="tab" data-go="status">현황</button>
    <button class="tab" data-go="notes">오답</button>
    <button class="tab" data-go="upload">등록</button>
    <button class="tab" data-go="random">랜덤</button>
    <button class="tab" data-go="records">기록</button>
    <button class="tab" data-go="settings">설정</button>
  </nav>
</header>
<main id="app"></main>
<div id="toast" role="status"></div>

<script>
const KEY_KEYS = 'mel_apikeys';
const DATA_KEY = 'mel_data';
// 모델은 위에서부터 순서대로 시도합니다. 실패하면 다음 모델로 넘어갑니다.
const CFG = {
  GEMINI_MODELS: ['gemini-flash-lite-latest', 'gemini-flash-latest'],
  CLAUDE_MODEL: 'claude-sonnet-5-5',
  RETRY_MAX: 3,
};
// 대분류는 고정 목록, 중분류는 AI가 자동으로 붙임
const MAJORS = ['수와 연산', '문자와 식', '함수', '도형', '측정', '확률과 통계', '기타'];

const XP = { correct: 10, wrong: 3, graduate: 30, randomSet: 20 };
const MAX_LEVEL = 50;
const GEMS = [
  { name: '수정', icon: '⚪' }, { name: '자수정', icon: '🟣' }, { name: '사파이어', icon: '🔵' },
  { name: '에메랄드', icon: '🟢' }, { name: '루비', icon: '🔴' }, { name: '토파즈', icon: '🟠' },
  { name: '아쿠아마린', icon: '🩵' }, { name: '다이아몬드', icon: '💎' }, { name: '오팔', icon: '🌸' },
  { name: '무지개 보석', icon: '🌈' },
];
const xpFor = (L) => 40 * (L - 1) + 5 * (L - 1) * L;

const STICKERS = ['⭐', '🌟', '🎈', '🦄', '🐯', '🚀', '🌈', '🍀', '🎨', '🦖', '🧩', '🏅'];
const PRAISE = ['정답! 잘했어요 👏', '좋아요, 이 문제는 이제 내 것이에요!', '완벽해요! 생각을 잘 정리했네요.', '이번에는 정확하게 맞혔어요!'];
const COMFORT = ['괜찮아요. 틀린 문제가 제일 많이 배우는 문제예요.', '아쉬워요. 해설을 보면서 한 걸음 더 가 봐요.', '실수는 연습의 일부예요. 다시 풀면 돼요!'];
const NET_MSG = '인터넷 연결을 확인해 주세요. (차단 앱이나 VPN이 켜져 있으면 끄고 다시 시도)';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, f) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : f; } catch (e) { return f; } },
  set(k, v) { localStorage.setItem(k, JSON.stringify(v)); },
};
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const load = () => {
  const d = store.get(DATA_KEY, null) || {};
  return {
    problems: d.problems || [], sets: d.sets || [], stickers: d.stickers || [],
    xp: Number(d.xp) || 0, log: d.log || [], xpLog: d.xpLog || [],
  };
};
const saveData = (d) => store.set(DATA_KEY, d);

// 문제 사진은 용량이 커서 IndexedDB에 따로 저장합니다 (문제 데이터와 분리)
let dbP;
function imageDb() {
  if (!dbP) dbP = new Promise((res, rej) => {
    const r = indexedDB.open('mel_images', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('img');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbP;
}
async function putImage(id, data) {
  const d = await imageDb();
  return new Promise((res, rej) => {
    const t = d.transaction('img', 'readwrite');
    t.objectStore('img').put(data, id);
    t.oncomplete = res; t.onerror = () => rej(t.error);
  });
}
async function getImage(id) {
  const d = await imageDb();
  return new Promise((res) => {
    const q = d.transaction('img').objectStore('img').get(id);
    q.onsuccess = () => res(q.result || ''); q.onerror = () => res('');
  });
}
async function deleteImage(id) {
  const d = await imageDb();
  d.transaction('img', 'readwrite').objectStore('img').delete(id);
}
async function loadImages() {
  for (const el of document.querySelectorAll('img[data-img]')) {
    const src = await getImage(el.dataset.img);
    if (src) { el.src = src; el.hidden = false; }
  }
}
const getKeys = () => store.get(KEY_KEYS, { gemini: '', claude: '' });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => new Date().toISOString().slice(0, 10);
const pick1 = (arr) => arr[Math.floor(Math.random() * arr.length)];
const dayKey = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
function weekKey(ts) {
  const dt = new Date(ts);
  dt.setDate(dt.getDate() - ((dt.getDay() + 6) % 7));
  return dayKey(dt);
}

function levelInfo(xp) {
  let lv = 1;
  while (lv < MAX_LEVEL && xp >= xpFor(lv + 1)) lv++;
  return { xp, lv, gem: GEMS[Math.ceil(lv / 5) - 1], base: xpFor(lv), next: lv < MAX_LEVEL ? xpFor(lv + 1) : null };
}

let state = {
  view: 'status', randomMajors: null, randomCount: 10, session: null,
  pendingFiles: [], uploadLog: [], uploading: false,
  keyTest: { gemini: '', claude: '' },
};
let toastTimer;
function toast(msg, ms = 3000) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

// ---------- AI 호출 ----------
const CLASSIFY_PROMPT = `수학 문제 사진을 읽고 아래 JSON 형식으로만 답하세요. 다른 말은 쓰지 마세요.
{"question":"문제 본문 (수식은 일반 문자로: x², ÷, √)","choices":["①…","②…","③…","④…","⑤…"],"answer_index":0,"major":"대분류","minor":"중분류 (짧은 한국어, 예: 분수의 덧셈, 소금물 농도, 이차방정식)","summary":"핵심 정답을 한 줄로","explanation":"풀이 과정을 단계별로 짧게. 교과 용어 사용","hints":["힌트1: 방향만","힌트2: 식 세우기","힌트3: 계산 직전"]}
규칙: 수식은 반드시 $...$ 안에 LaTeX로 쓰세요. 예: $x^{2}$, $\\frac{1}{2}$, $\\pi$, $3 \\div 2$, $\\sqrt{3}$. JSON 문자열 안에서는 백슬래시를 두 번(\\\\) 쓰세요. major는 반드시 다음 중 하나: ${MAJORS.join(', ')}. minor는 너무 세세하지 않게 중분류 수준으로 쓰세요. answer_index는 정답 보기 번호(0~4). 사진에 보기가 없으면 5지선다 보기를 새로 만들고 정답 1개를 포함하세요.`;

const SIMILAR_PROMPT = (p) => `아래 문제와 같은 유형, 같은 개념의 유사문제를 1개 만드세요. 숫자와 조건만 바꾸고 난이도는 비슷하게 하세요. 수식은 반드시 $...$ 안에 LaTeX로 쓰세요(예: $x^{2}$, $\\frac{1}{2}$). JSON 문자열 안에서는 백슬래시를 두 번(\\\\) 쓰세요. JSON 형식으로만 답하세요.
{"question":"","choices":["①…","②…","③…","④…","⑤…"],"answer_index":0,"explanation":"풀이를 단계별로 짧게","hints":["힌트1","힌트2","힌트3"],"figure_changes":[]}
원본 문제: ${p.question}
원본 보기: ${p.choices.join(' ')}`;

function parseJson(t) {
  try {
    const s = t.indexOf('{'), e = t.lastIndexOf('}');
    return JSON.parse(t.slice(s, e + 1));
  } catch (e) {
    throw new Error('AI 응답을 읽지 못했어요. 다시 시도해 주세요.');
  }
}

async function apiError(r, name) {
  let detail = '';
  try { const j = await r.json(); detail = (j.error && j.error.message) || ''; } catch (e) {}
  return new Error(`${name} 오류 (${r.status})${detail ? ' - ' + detail : ''}`);
}

// Gemini 호출: 일시적 오류(429/500/503/504, 네트워크)는 자동으로 다시 연결하고,
// 모델이 없으면(404) 다음 모델로 넘어갑니다. 키가 틀리면(400/401/403) 바로 멈춥니다.
async function geminiRequest(body) {
  const key = getKeys().gemini;
  if (!key) throw new Error('설정에서 Gemini 키를 입력하고 저장하세요.');
  let lastErr = new Error('Gemini 연결에 실패했어요.');
  for (const model of CFG.GEMINI_MODELS) {
    for (let attempt = 1; attempt <= CFG.RETRY_MAX; attempt++) {
      try {
        const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (r.ok) return { json: await r.json(), model };
        lastErr = await apiError(r, 'Gemini');
        if ([400, 401, 403].includes(r.status)) throw lastErr;   // 키 문제: 재시도 無
        if (r.status === 404) break;                              // 모델 없음: 다음 모델로
      } catch (e) {
        if (e instanceof TypeError) lastErr = new Error(NET_MSG);
        else if (e.message && /^Gemini 오류 \(40[013]\)/.test(e.message)) throw e;
        else lastErr = e;
      }
      if (attempt < CFG.RETRY_MAX) {
        toast(`AI 연결을 다시 시도하는 중... (${attempt}/${CFG.RETRY_MAX - 1})`, 1800);
        await sleep(1500 * attempt);
      }
    }
  }
  throw lastErr;
}

async function callGemini(prompt, b64) {
  const parts = [{ text: prompt }];
  if (b64) parts.unshift({ inline_data: { mime_type: 'image/jpeg', data: b64 } });
  const { json } = await geminiRequest({ contents: [{ parts }], generationConfig: { responseMimeType: 'application/json' } });
  const txt = json.candidates && json.candidates[0] && json.candidates[0].content && json.candidates[0].content.parts[0].text;
  if (!txt) throw new Error('Gemini 응답이 비어 있어요. 사진을 다시 찍어 보세요.');
  return parseJson(txt);
}

async function callClaude(prompt) {
  const key = getKeys().claude;
  if (!key) throw new Error('설정에서 Claude 키를 입력하고 저장하세요.');
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({ model: CFG.CLAUDE_MODEL, max_tokens: 1500, messages: [{ role: 'user', content: prompt }] }),
  });
  if (!r.ok) throw await apiError(r, 'Claude');
  const j = await r.json();
  return parseJson(j.content[0].text);
}

async function fileToJpegBase64(file, maxSide = 1024, quality = 0.8) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error('이미지를 열 수 없어요. 사진 형식(HEIC 등)을 확인해 주세요.'));
    i.src = url;
  });
  // 사진을 1024px로 줄여서 토큰을 아낌
  const s = Math.min(1, maxSide / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(url);
  return c.toDataURL('image/jpeg', quality).split(',')[1];
}

function similarity(a, b) {
  const n = (s) => String(s).replace(/\s/g, '');
  a = n(a); b = n(b);
  if (!a || !b) return 0;
  const grams = (s) => { const g = new Set(); for (let i = 0; i < s.length - 1; i++) g.add(s.slice(i, i + 2)); return g; };
  const A = grams(a), B = grams(b);
  let inter = 0; A.forEach((x) => { if (B.has(x)) inter++; });
  return inter / ((A.size + B.size - inter) || 1);
}

// ---------- 등록 ----------
async function handleUpload(file) {
  try {
    const b64 = await fileToJpegBase64(file);
    const d = load();
    const res = await callGemini(CLASSIFY_PROMPT, b64);
    if (!res.question) throw new Error('문제 내용을 읽지 못했어요. 사진을 더 선명하게 다시 찍어 주세요.');
    if (!MAJORS.includes(res.major)) res.major = '기타';
    const minor = (res.minor || '기타').trim();
    const dup = d.problems.find((p) => similarity(p.question, res.question) >= 0.8);
    if (dup) {
      dup.wrongCount++; dup.correctStreak = 0; dup.graduated = false;
      saveData(d);
      return { ok: true, msg: `이미 있던 문제예요 → ${dup.major} > ${dup.minor}, 틀린 횟수 ${dup.wrongCount}번` };
    }
    const id = uid();
    // 그림까지 보이도록 사진을 600px로 줄여 함께 저장 (글자 인식용 원본과 별도)
    const thumb = await fileToJpegBase64(file, 600, 0.6);
    await putImage(id, 'data:image/jpeg;base64,' + thumb);
    d.problems.push({
      id, major: res.major, minor, question: res.question, choices: res.choices || [],
      answer_index: res.answer_index, summary: res.summary || '', explanation: res.explanation || '',
      hints: res.hints || [], wrongCount: 1, correctStreak: 0, graduated: false, createdAt: Date.now(),
    });
    saveData(d);
    return { ok: true, msg: `오답으로 저장 → ${res.major} > ${minor}` };
  } catch (e) {
    return { ok: false, msg: e.message || '알 수 없는 오류가 났어요.' };
  }
}

async function startUpload() {
  if (!state.pendingFiles.length || state.uploading) return;
  state.uploading = true;
  const files = state.pendingFiles;
  state.uploadLog = files.map((f) => ({ name: f.name, state: 'wait', msg: '대기 중' }));
  render();
  for (let i = 0; i < files.length; i++) {
    state.uploadLog[i].state = 'busy'; state.uploadLog[i].msg = '읽는 중...'; render();
    const r = await handleUpload(files[i]);
    state.uploadLog[i].state = r.ok ? 'ok' : 'err';
    state.uploadLog[i].msg = r.msg;
    render();
  }
  state.uploading = false;
  state.pendingFiles = [];
  render();
  const okCount = state.uploadLog.filter((x) => x.state === 'ok').length;
  toast(`${files.length}장 중 ${okCount}장 처리 완료`);
}

function setMajor(id, val) {
  const d = load();
  const p = d.problems.find((x) => x.id === id);
  if (!p) return;
  p.major = val; saveData(d); render();
}

function renameMinor(id) {
  const d = load();
  const p = d.problems.find((x) => x.id === id);
  if (!p) return;
  const t = (prompt('중분류 이름을 입력하세요', p.minor) || '').trim();
  if (!t) return;
  p.minor = t; saveData(d); render();
}

function deleteProblem(id) {
  if (!confirm('이 오답을 삭제할까요?')) return;
  const d = load();
  d.problems = d.problems.filter((p) => p.id !== id);
  deleteImage(id);
  saveData(d); render();
}

// ---------- 풀이 ----------
function startRetake(id) {
  const p = load().problems.find((x) => x.id === id);
  if (!p) return;
  state.session = { mode: 'retake', items: [p], answers: {}, hints: {}, open: {}, graded: false };
  go('session');
}

function startRandom() {
  const d = load();
  const sel = state.randomMajors ?? MAJORS;
  const pool = d.problems.filter((p) => !p.graduated && sel.includes(p.major));
  if (!pool.length) { toast('선택한 대분류에 출제할 오답이 없어요.'); return; }
  const count = Math.min(state.randomCount, pool.length);
  const picked = [], used = {};
  let rest = [...pool];
  while (picked.length < count && rest.length) {
    // 틀린 횟수가 많을수록 확률이 높고, 같은 대분류가 많이 나온 만큼 확률을 낮춤
    const w = rest.map((p) => Math.max(1, p.wrongCount) / (1 + (used[p.major] || 0) * 2));
    const total = w.reduce((a, b) => a + b, 0);
    let r = Math.random() * total, idx = 0;
    for (; idx < w.length - 1; idx++) { r -= w[idx]; if (r <= 0) break; }
    const item = rest.splice(idx, 1)[0];
    picked.push(item);
    used[item.major] = (used[item.major] || 0) + 1;
  }
  state.session = { mode: 'random', items: picked, answers: {}, hints: {}, open: {}, graded: false };
  go('session');
}

// 유사문제는 한 문제씩 따로 풀고, 오답 기록에는 반영하지 않습니다.
async function makeSimilar(base) {
  try {
    toast('유사문제를 만드는 중입니다... (잠시 기다려 주세요)', 6000);
    // 원본 사진(그림 포함)을 함께 보내서, 그림 조건을 글로 옮긴 유사문제를 만들게 함
    const thumb = await getImage(base.id);
    const prompt = SIMILAR_PROMPT(base) + (thumb ? '\n사진에 그림이 있습니다. 그림은 원본 사진을 그대로 보여 주므로 그림 모양은 바꾸지 말고, 그림 속 숫자나 길이만 바꾸세요. 바뀐 값은 figure_changes에 "항목: 원래값 → 새값" 형식으로 적으세요. 그림이 없으면 figure_changes는 빈 배열로 두세요.' : '');
    const parts = [{ text: prompt }];
    if (thumb) parts.unshift({ inline_data: { mime_type: 'image/jpeg', data: thumb.split(',')[1] } });
    const { json } = await geminiRequest({ contents: [{ parts }], generationConfig: { responseMimeType: 'application/json' } });
    const txt = json.candidates && json.candidates[0] && json.candidates[0].content.parts[0].text;
    const s = parseJson(txt || '');
    const item = { id: 'sim', imgId: thumb ? base.id : null, figChanges: s.figure_changes || [], major: base.major, minor: base.minor, question: s.question, choices: s.choices || [], answer_index: s.answer_index, explanation: s.explanation || '', hints: s.hints || [], summary: '' };
    state.session = { mode: 'similar', items: [item], answers: {}, hints: {}, open: {}, graded: false };
    go('session');
  } catch (e) { toast(e.message, 4000); }
}

async function startSimilar(i) {
  await makeSimilar(state.session.items[i]);
}

function gradeSession() {
  const s = state.session, n = s.items.length;
  if (Object.keys(s.answers).length < n) { toast('모든 문제의 답을 골라 주세요.'); return; }
  const d = load();
  const xpBefore = d.xp;
  let score = 0, best = 0, run = 0, gained = 0;
  const newlyGrad = [];
  s.msgs = [];
  s.items.forEach((it, i) => {
    const ok = s.answers[i] === it.answer_index;
    s.msgs[i] = ok ? pick1(PRAISE) : pick1(COMFORT);
    gained += ok ? XP.correct : XP.wrong;
    if (ok) { score++; run++; best = Math.max(best, run); } else run = 0;
    if (s.mode === 'similar') return;
    d.log.push({ at: Date.now(), ok, major: it.major, minor: it.minor });
    const p = d.problems.find((x) => x.id === it.id);
    if (!p) return;
    if (ok) {
      p.correctStreak++;
      if (p.correctStreak >= 2 && !p.graduated) {
        p.graduated = true;
        gained += XP.graduate;
        const emoji = STICKERS[d.stickers.length % STICKERS.length];
        d.stickers.push({ id: p.id, emoji, major: p.major, at: Date.now() });
        newlyGrad.push(emoji);
      }
    } else { p.correctStreak = 0; p.wrongCount++; }
  });
  if (s.mode === 'random') { d.sets.push({ date: today(), score, total: n, at: Date.now() }); gained += XP.randomSet; }
  d.xp = xpBefore + gained;
  if (gained > 0) d.xpLog.push({ at: Date.now(), xp: d.xp });
  saveData(d);

  const before = levelInfo(xpBefore), after = levelInfo(d.xp);
  s.score = score; s.best = best; s.gained = gained; s.graded = true;
  render();

  if (after.lv > before.lv) {
    const newGem = after.gem !== before.gem ? ` 새 보석 획득! ${after.gem.icon} ${after.gem.name}` : '';
    toast(`🎉 레벨 업! Lv.${after.lv}${newGem}`);
  } else if (newlyGrad.length) {
    toast(`졸업! 스티커 ${newlyGrad.join(' ')} 를 받았어요`);
  }
}

function finishSession() { state.session = null; go('notes'); }

  let html = `<h2>스티커와 세트 기록</h2>
    <div class="card"><span class="level">${L.gem.icon} ${L.gem.name} Lv.${L.lv}</span> <span class="note">· 총 ${L.xp} XP</span></div>`;
  if (!d.stickers.length) html += `<p class="note">문제를 졸업하면 스티커를 받아요.</p>`;
  else {
    const counts = {};
    d.stickers.forEach((s) => { counts[s.emoji] = (counts[s.emoji] || 0) + 1; });
    html += `<div class="card stickers">${Object.entries(counts).map(([e, c]) => `<span>${e}<small>× ${c}</small></span>`).join('')}</div>`;
  }
  if (sorted.length >= 2) html += `<div class="card"><p class="note">점수 추이 (정답률)</p>${scoreChart(sorted)}</div>`;
  if (!sorted.length) html += `<p class="note">아직 완료한 랜덤 세트가 없어요.</p>`;
  [...sorted].reverse().forEach((r) => {
    html += `<div class="card"><div class="row"><span>${esc(r.date)}</span><strong>${r.score} / ${r.total}</strong></div></div>`;
  });
  html += `<h2>백업</h2>
    <p class="note">오답, 기록, 스티커, 경험치를 파일로 내보내거나 불러올 수 있어요. API 키와 문제 사진은 포함되지 않습니다(사진은 이 기기에만 저장됩니다).</p>
    <button class="big" data-action="export">파일로 내보내기</button>
    <label>불러오기 (파일 선택)<input type="file" id="import-file" accept="application/json"></label>`;
  return html;
}

function viewSettings() {
  const k = getKeys();
  return `<h2>API 키 설정</h2>
    <p class="note">키는 이 기기 브라우저에만 저장되며 외부 서버로 보내지 않습니다.</p>
    <label>Gemini 키<input id="key-gemini" type="password" autocomplete="off" value="${esc(k.gemini)}"></label>
    <div class="row"><button class="sm pri" data-action="test-gemini">저장 후 Gemini 연결 테스트</button></div>
    <p class="note">${esc(state.keyTest.gemini)}</p>
    <label>Claude 키<input id="key-claude" type="password" autocomplete="off" value="${esc(k.claude)}"></label>
    <div class="row"><button class="sm pri" data-action="test-claude">저장 후 Claude 연결 테스트</button></div>
    <p class="note">${esc(state.keyTest.claude)}</p>
    <button class="big" data-action="save-keys">저장만 하기</button>
    <h2>데이터 초기화</h2>
    <p class="note">오답, 기록, 스티커, 경험치, 사진이 모두 지워집니다. API 키는 남아요.</p>
    <button class="big" data-action="reset" style="background:#d9534f">모두 초기화</button>`;
}

// 문제·기록·사진을 모두 지움 (API 키는 남김)
async function resetAll() {
  if (!confirm('오답, 기록, 스티커, 경험치, 사진을 모두 지울까요? (API 키는 남겨요)')) return;
  if (!confirm('정말 지울까요? 되돌릴 수 없어요.')) return;
  localStorage.removeItem(DATA_KEY);
  const d = await imageDb();
  d.transaction('img', 'readwrite').objectStore('img').clear();
  state.session = null; state.uploadLog = []; state.pendingFiles = [];
  go('status');
  toast('모두 초기화했어요.');
}

const VIEWS = { notes: viewNotes, upload: viewUpload, random: viewRandom, status: viewStatus, session: viewSession, records: viewRecords, settings: viewSettings };

function render() {
  $('app').innerHTML = VIEWS[state.view]();
  loadImages();
  // $...$ 안의 수식을 KaTeX로 그림 (라이브러리 로딩 전이면 글자 그대로 보임)
  if (window.renderMathInElement) {
    renderMathInElement($('app'), { delimiters: [{ left: '$', right: '$', display: false }], throwOnError: false, ignoredTags: ['script', 'style', 'textarea', 'pre', 'code'] });
  }
  document.querySelectorAll('nav .tab').forEach((b) => b.classList.toggle('on', b.dataset.go === state.view));
}
function go(v) { state.view = v; render(); window.scrollTo(0, 0); }

// ---------- 이벤트 ----------
document.addEventListener('click', async (e) => {
  const nav = e.target.closest('[data-go]');
  if (nav) { go(nav.dataset.go); return; }
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const a = b.dataset.action, i = Number(b.dataset.i), s = state.session;
  switch (a) {
    case 'retake': startRetake(b.dataset.id); break;
    case 'delete': deleteProblem(b.dataset.id); break;
    case 'rename-minor': renameMinor(b.dataset.id); break;
    case 'start-upload': await startUpload(); break;
    case 'start-random': startRandom(); break;
    case 'pick': if (s && !s.graded) { s.answers[i] = Number(b.dataset.c); render(); } break;
    case 'hint': if (s) { s.hints[i] = (s.hints[i] || 0) + 1; render(); } break;
    case 'explain': if (s) { s.open[i] = !s.open[i]; render(); } break;
    case 'grade': gradeSession(); break;
    case 'similar': await startSimilar(i); break;
    case 'similar-note': { const p = load().problems.find((x) => x.id === b.dataset.id); if (p) await makeSimilar(p); break; }
    case 'finish': finishSession(); break;
    case 'save-keys': saveKeys(); break;
    case 'test-gemini': await testGemini(); break;
    case 'test-claude': await testClaude(); break;
    case 'export': exportData(); break;
    case 'reset': await resetAll(); break;
  }
});

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'file-input') {
    state.pendingFiles = [...t.files];
    state.uploadLog = [];
    render();
  }
  else if (t.id === 'import-file' && t.files[0]) importData(t.files[0]);
  else if (t.dataset.change === 'major') setMajor(t.dataset.id, t.value);
  else if (t.dataset.change === 'count') { state.randomCount = Math.min(30, Math.max(3, Number(t.value) || 10)); render(); }
  else if (t.dataset.all !== undefined) { state.randomMajors = t.checked ? [...MAJORS] : []; render(); }
  else if (t.dataset.major !== undefined) {
    const cur = new Set(state.randomMajors ?? MAJORS);
    t.checked ? cur.add(t.dataset.major) : cur.delete(t.dataset.major);
    state.randomMajors = [...cur]; render();
  }
});

render();
// 수식 라이브러리는 비동기로 불러오므로, 로딩이 끝나면 한 번 더 그립니다
window.addEventListener('load', render);
</script>
</body>
</html>
